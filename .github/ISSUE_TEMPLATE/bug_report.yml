name: Bug Report
description: File a bug report to help us improve.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        Reproduction repository: https://github.com/...

        1. Install ...
        2. Initialize the distribution with ...
        3. Trigger ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment.
      placeholder: |
        - Distribution version or commit: [e.g., main@abc1234]
        - Browser and version: [e.g., Edge 140]
        - OS: [e.g., Windows 11]
        - Framework: [e.g., React 19, Angular 21, or vanilla TypeScript]
        - Bundler and version: [e.g., Vite 8.2]
        - @opentelemetry/api version: [e.g., 1.9.1]
        - @opentelemetry/api-logs version: [e.g., 0.222.0]
        - Export destination: [e.g., Azure Monitor or OTLP/HTTP collector]
    validations:
      required: true

  - type: textarea
    id: telemetry-and-diagnostics
    attributes:
      label: Telemetry and diagnostics
      description: Share relevant console errors, diagnostic codes, network results, or sanitized exported spans and log records. Remove secrets and personal data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, traces, timing details, regressions, or other information that may help investigation.
    validations:
      required: false
