name: Coverage comment

on:
  workflow_run:
    workflows: ["PR validation"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: coverage-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post coverage comparison
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never execute PR code with this workflow's writable token.
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve current PR and its coverage artifacts
        id: report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveCoverageReport } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/coverage-report.mjs`);
            await resolveCoverageReport({ github, context, core });

      - name: Download baseline report
        if: steps.report.outputs.pr-number != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.report.outputs.base-artifact }}
          path: ${{ runner.temp }}/coverage-archives/base
          skip-decompress: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate report
        if: steps.report.outputs.pr-number != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.report.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/coverage-archives/candidate
          skip-decompress: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate archives and read bounded summaries
        if: steps.report.outputs.pr-number != ''
        run: |
          python scripts/coverage_artifact.py "$RUNNER_TEMP/coverage-archives/base" "$RUNNER_TEMP/coverage-input/base"
          python scripts/coverage_artifact.py "$RUNNER_TEMP/coverage-archives/candidate" "$RUNNER_TEMP/coverage-input/candidate"

      - name: Render and post coverage comparison
        if: steps.report.outputs.pr-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_PR_NUMBER: ${{ steps.report.outputs.pr-number }}
          COVERAGE_BASE_SHA: ${{ steps.report.outputs.base-sha }}
        with:
          script: |
            const { readCoverageSummary, postCoverageComment } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/coverage-report.mjs`);
            await postCoverageComment({
              github, context, core,
              prNumber: Number(process.env.COVERAGE_PR_NUMBER),
              baseSha: process.env.COVERAGE_BASE_SHA,
              baseline: await readCoverageSummary(`${process.env.RUNNER_TEMP}/coverage-input/base/coverage-summary.json`),
              candidate: await readCoverageSummary(`${process.env.RUNNER_TEMP}/coverage-input/candidate/coverage-summary.json`)
            });
