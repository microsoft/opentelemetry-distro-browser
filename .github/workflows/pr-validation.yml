name: PR validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: CHANGELOG updated
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
          else
            echo "::error::CHANGELOG.md was not updated in this PR."
            echo "Add an entry to CHANGELOG.md, or apply the 'skip-changelog' label if this change does not warrant one."
            exit 1
          fi

  quality:
    name: ESLint, Prettier, and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test coverage reporting
        run: npm run test:report

      - name: Test performance result schema and export safeguards
        run: npm run test:perf

  tests:
    name: Browser tests, API, and bundles (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, Firefox, WebKit, and system dependencies
        run: npm run test:install-browsers -- --with-deps

      - name: Run Vitest unit tests across browser engines
        run: npm run test:unit

      - name: Collect unit test coverage in Chromium
        run: npm run test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Build and minify bundles
        run: npm run build

      - name: Measure browser bundle sizes and generate reports
        run: npm run size

      - name: Run offline browser performance benchmark
        run: npm run perf

      - name: Verify package outputs
        run: npm run test:build

      - name: Run browser bundle integration tests across browser engines
        run: npm run test:integration

      - name: Check public API report
        run: npm run api:check

      - name: Check out the pull request base revision
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-size-base
          persist-credentials: false

      - name: Measure bundle sizes at the pull request base revision
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        working-directory: .bundle-size-base
        run: npm ci && npm run build && npm run size

      - name: Compare bundle sizes with the pull request base revision
        if: github.event_name == 'pull_request' && matrix.node-version == '24'
        run: >-
          npm run size:compare --
          .bundle-size-base/reports/bundle-size.json
          reports/bundle-size.json
          reports/bundle-size-comparison.md

      - name: Publish bundle sizes to the check summary
        if: ${{ !cancelled() && hashFiles('reports/bundle-size.md') != '' }}
        run: cat reports/bundle-size.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bundle-size comparison to the check summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.node-version == '24' && hashFiles('reports/bundle-size-comparison.md') != '' }}
        run: cat reports/bundle-size-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Upload bundle-size reports
        if: ${{ !cancelled() && hashFiles('reports/bundle-size.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-reports-node-${{ matrix.node-version }}
          path: |
            reports/bundle-size.json
            reports/bundle-size.md
            reports/bundle-size-comparison.md
            reports/bundle-stats.html
          if-no-files-found: error
          retention-days: 14

  coverage-base:
    name: Coverage baseline (Node 24)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run baseline coverage
        # The base revision may not yet configure the JSON summary reporter.
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Upload baseline coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-base-${{ github.event.pull_request.base.sha }}
          path: coverage/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
